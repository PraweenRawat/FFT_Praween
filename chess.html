<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chess Board Using Grid</title>

    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            margin-top: 30px;
        }

        .chess-board {
            width: 560px;
            height: 560px;
            margin: auto;

            display: grid;

            grid-template-columns: auto auto auto auto auto auto auto auto;
            grid-template-rows: repeat(8, 1fr);
            border: 4px solid black;
        }

        .chess-board div {

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 50px;

        }

        .white {

            background-color: white;

        }

        .black {

            background-color: black;

        }

        .black-piece {

            color: black;

        }

        .white-piece {

            color: white;

        }
    </style>

</head>


<body>




    <div class="container">


        <div class="chess-board">


            <!-- ROW 1 -->
            <div class="white black-piece">♜</div>
            <div class="black white-piece">♞</div>
            <div class="white black-piece">♝</div>
            <div class="black white-piece">♛</div>
            <div class="white black-piece">♚</div>
            <div class="black white-piece">♝</div>
            <div class="white black-piece">♞</div>
            <div class="black white-piece">♜</div>


            <!-- ROW 2 -->
            <div class="black white-piece">♟</div>
            <div class="white black-piece">♟</div>
            <div class="black white-piece">♟</div>
            <div class="white black-piece">♟</div>
            <div class="black white-piece">♟</div>
            <div class="white black-piece">♟</div>
            <div class="black white-piece">♟</div>
            <div class="white black-piece">♟</div>


            <!-- ROW 3 -->
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>


            <!-- ROW 4 -->
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>


            <!-- ROW 5 -->
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>


            <!-- ROW 6 -->
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>
            <div class="black"></div>
            <div class="white"></div>


            <!-- ROW 7 -->
            <div class="white black-piece">♙</div>
            <div class="black white-piece">♙</div>
            <div class="white black-piece">♙</div>
            <div class="black white-piece">♙</div>
            <div class="white black-piece">♙</div>
            <div class="black white-piece">♙</div>
            <div class="white black-piece">♙</div>
            <div class="black white-piece">♙</div>


            <!-- ROW 8 -->
            <div class="black white-piece">♖</div>
            <div class="white black-piece">♘</div>
            <div class="black white-piece">♗</div>
            <div class="white black-piece">♕</div>
            <div class="black white-piece">♔</div>
            <div class="white black-piece">♗</div>
            <div class="black white-piece">♘</div>
            <div class="white black-piece">♖</div>


        </div>

    </div>

</body>

</html>
